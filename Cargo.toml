[package]
name        = "network_redteam_grapher"
version     = "2.0.0"
edition     = "2021"
description = "DIAPILE - Network Redteam Grapher : AI-powered offensive security framework"
license     = "MIT"
authors     = ["nahiixcrow"]
readme      = "README.md"
rust-version = "1.74"
keywords    = ["security", "redteam", "network", "scanner", "ai"]
categories  = ["command-line-utilities", "network-programming"]
repository  = "https://github.com/ousseynoudia4-lgtm/diapile"
homepage    = "https://github.com/ousseynoudia4-lgtm/diapile"

[[bin]]
name = "nrtg"
path = "src/main.rs"

# Build profiles

[profile.dev]
opt-level = 0
debug = 0
codegen-units = 4

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
debug = 0
overflow-checks = false
rpath = false
incremental = false

# Dependencies

[dependencies]
tokio        = { version = "1.35", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util", "io-std", "signal", "fs"] }
async-trait  = "0.1"
rand         = "0.8"
base64       = "0.21"
futures      = "0.3"
reqwest      = { version = "0.11", features = ["json", "native-tls", "gzip", "brotli", "cookies", "stream"], default-features = false }
ureq         = { version = "2.9", features = ["json", "native-tls"], default-features = false }
serde        = { version = "1.0",  features = ["derive"] }
serde_json   = "1.0"
serde_yaml   = "0.9"
toml         = "0.8"
url          = "2.5"
regex        = "1.10"
lazy_static  = "1.4"
semver       = { version = "1.0", features = ["serde"] }
clap         = { version = "=4.5.17", features = ["derive", "env"] }
csv          = "1.3"
chrono       = { version = "0.4", features = ["serde"] }
anyhow       = "1.0"
thiserror    = "1.0"
tracing      = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
indicatif    = { version = "0.17", features = ["tokio"] }
uuid         = { version = "1.6",  features = ["v4", "serde"] }
md5          = "0.7"
moka         = { version = "0.12", features = ["future"] }
governor     = "0.6"
validator    = { version = "0.16", features = ["derive"] }
ipnetwork    = "0.20"
dotenvy      = "0.15"
urlencoding  = "2.1"
native-tls        = { version = "0.2", features = ["vendored"] }
tokio-rustls      = { version = "0.24", features = ["dangerous_configuration"] }
rustls            = { version = "0.21", features = ["dangerous_configuration"] }
rustls-native-certs = "0.6"
webpki            = "0.22"
webpki-roots      = "0.25"
aes           = "0.8"
aes-gcm           = "0.10"
rsa          = "0.9"
hkdf         = "0.12"
hex          = "0.4"
sha1         = "0.10"
sha2         = "0.10"
hmac         = "0.12"
sysinfo      = "0.30"
pnet_packet  = { version = "0.34", default-features = false }
pnet_base    = { version = "0.34", default-features = false }
md4 = "0.11.0"

[target.'cfg(unix)'.dependencies]
pnet = { version = "0.34", default-features = false, features = ["std"] }

[dev-dependencies]
tempfile   = "3.9"
tokio-test = "0.4"
mockall    = "0.12"

# ── Lints (Rust 1.74+) ───────────────────────────────────────────────────────
# Appliqués par `cargo clippy` (voir .github/workflows/ci.yml). Objectif : rendre
# visibles les régressions et interdire les panics implicites en production.
# Les fixtures de test sont exemptées via `#![cfg_attr(test, allow(...))]` (main.rs).

[lints.rust]
unused_imports   = "warn"
unused_variables = "warn"
unsafe_code      = "warn"

[lints.clippy]
# Robustesse : aucun `panic!` implicite sur des données non fiables (réseau, fichiers)
unwrap_used    = "warn"
expect_used    = "warn"
todo           = "warn"
unimplemented  = "warn"
dbg_macro      = "warn"
panic          = "warn"
# Qualité / lisibilité
redundant_clone  = "warn"
needless_collect = "warn"
manual_let_else  = "warn"

